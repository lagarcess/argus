category: capability_honesty
cases:
  - id: capability_honesty_options_straddle_tsla
    prompt: "can you run an options straddle on TSLA from 2024-01-01 through 2024-12-31?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
        clarification_matches_expected: true
        min_recovery_options: 1
      intent: unsupported_or_out_of_scope
      capability_verdict: unsupported
      assets: ["TSLA"]
      asset_class: equity
      strategy_type: null
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      benchmark_symbol: SPY
      stage_outcomes: ["needs_clarification", "await_user_reply"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: capability_honesty_golden_cross_control_aapl
    prompt: "Backtest $10,000 in AAPL from January 2, 2022 through January 2, 2025 using a golden cross."
    user_language: en
    ui_language: en
    expected:
      offered:
        launch_matches_expected: true
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["AAPL"]
      asset_class: equity
      strategy_type: signal_strategy
      date_range:
        start: "2022-01-02"
        end: "2025-01-02"
      effective_date_range:
        start: "2022-01-03"
        end: "2025-01-02"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 10000
      stage_outcomes: ["ready_for_confirmation", "await_approval"]
  - id: capability_honesty_momentum_breakout_aapl
    prompt: "Backtest $10,000 in AAPL from January 2, 2022 through January 2, 2025 using a momentum breakout strategy."
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
        clarification_matches_expected: true
        min_recovery_options: 1
      intent:
        [
          "unsupported_or_out_of_scope",
          "strategy_drafting",
          "backtest_execution",
        ]
      capability_verdict: unsupported
      assets: ["AAPL"]
      asset_class: equity
      capital_amount: 10000
      date_range:
        start: "2022-01-02"
        end: "2025-01-02"
      benchmark_symbol: SPY
      stage_outcomes: ["needs_clarification", "await_user_reply"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: capability_honesty_news_sentiment_rule_aapl
    prompt: "Backtest $10,000 in AAPL from January 2, 2022 through January 2, 2025, buying when news sentiment turns positive and selling when it turns negative."
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
        clarification_matches_expected: true
        min_recovery_options: 1
      intent:
        [
          "unsupported_or_out_of_scope",
          "strategy_drafting",
          "backtest_execution",
        ]
      capability_verdict: unsupported
      assets: ["AAPL"]
      asset_class: equity
      capital_amount: 10000
      date_range:
        start: "2022-01-02"
        end: "2025-01-02"
      benchmark_symbol: SPY
      stage_outcomes: ["needs_clarification", "await_user_reply"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: capability_honesty_future_performance_nvda_golden_cross
    # Decision 10 (2026-09-10): a forward-looking question is answered as
    # grounded scenarios, never refused. The golden cross inside the question
    # does not make it a test request; a typed future horizon keeps the
    # question off the strategy route. The historical test is offered beside
    # the answer as a next experiment, never run.
    prompt: "If I invest $10,000 in NVDA using a golden cross strategy, how much will it be worth in ten years?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
        min_next_experiment_rows: 1
      intent: ["conversation_followup", "beginner_guidance"]
      capability_verdict: answer_only
      stage_outcomes: ["ready_to_respond"]
      research:
        published: true
    prose_judge:
      criteria: ["honesty", "scenario_framing", "no_raw_runtime_error"]
  - id: capability_honesty_future_performance_btc_regression
    # Crypto has no provider finance coverage, so the claim is grounded on
    # public pages alone (web search without the finance tool) and is still
    # answered as scenarios rather than degraded to a coverage note.
    prompt: "If I invest $10,000 in Bitcoin and just hold it, what will it be worth in ten years?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
        min_next_experiment_rows: 1
      intent: ["conversation_followup", "beginner_guidance"]
      capability_verdict: answer_only
      stage_outcomes: ["ready_to_respond"]
      research:
        published: true
        shape: balanced
    prose_judge:
      criteria: ["honesty", "scenario_framing", "no_raw_runtime_error"]
