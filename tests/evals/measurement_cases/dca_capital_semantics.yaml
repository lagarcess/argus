category: dca_capital_semantics
cases:
  # PR #491's own highest-risk prediction: "I'll start by putting in $200 a
  # month" must resolve the amount as the CONTRIBUTION, never the seed. The
  # failure symptom would be capital_amount null with initial_capital set,
  # which produces a spurious missing-contribution clarification instead of
  # reaching the confirmation card.
  - id: dca_capital_semantics_start_by_phrase_is_contribution_issue_455
    prompt: "I'll start by putting in $200 a month into SPY, from January 2024 through December 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["SPY"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 200
      recurring_contribution: 200
      starting_capital: 0
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # Control pair for the case above: when the contribution is genuinely
  # absent, the missing-contribution clarification is the correct outcome.
  - id: dca_capital_semantics_missing_contribution_asks_amount_issue_455
    prompt: "Can you test a monthly DCA into SPY for 2024?"
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: needs_clarification
      assets: ["SPY"]
      asset_class: equity
      requested_field: capital_amount
      stage_outcomes: ["needs_clarification", "await_user_reply"]

  # "I only have $5,000" is a plan-wide ceiling, not a starting principal and
  # not the contribution. The stated amount funds nothing; the missing
  # contribution is still collected, and the ceiling is deferred under its
  # own name.
  - id: dca_capital_semantics_only_have_amount_is_ceiling_issue_455
    prompt: "I only have $5,000 to invest. Can you test putting money into VOO every month through 2024?"
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: unsupported
      assets: ["VOO"]
      asset_class: equity
      missing_required_fields: ["capital_amount"]
      stage_outcomes: ["needs_clarification", "await_user_reply"]
      clarification:
        kind: unsupported_recovery
        reason_code: unsupported_dca_contribution_ceiling

  # A complete plan beside an explicit cap: the plan stays intact and the cap
  # is refused by its own name rather than absorbed into either money role.
  - id: dca_capital_semantics_explicit_cap_refused_by_name_issue_455
    prompt: "DCA $200 a month into VOO from January 2024 through December 2024, but don't invest more than $5,000 total."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: unsupported
      assets: ["VOO"]
      asset_class: equity
      capital_amount: 200
      contribution_period: monthly
      stage_outcomes: ["needs_clarification", "await_user_reply"]
      clarification:
        kind: unsupported_recovery
        reason_code: unsupported_dca_contribution_ceiling

  # A stated seed reaches ready_to_run with both money roles under their own
  # names: the seed as starting_capital, the contribution as itself.
  - id: dca_capital_semantics_stated_seed_reaches_ready_to_run_issue_455
    prompt: "Start with $5,000 in SPY and add $200 every month, from January 2024 through December 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["SPY"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 200
      recurring_contribution: 200
      starting_capital: 5000
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # A $0 seed with contributions is accepted, and the bankroll floor
  # (MIN_STARTING_CAPITAL, $1,000) applies to neither role: the $50
  # contribution is below it and the seed is zero, yet the plan is fundable.
  # starting_capital is asserted as 0, so the fact must exist rather than be
  # absent.
  - id: dca_capital_semantics_zero_seed_small_contribution_executable_issue_455
    prompt: "Invest $50 into SPY every month during 2024. I'm starting from zero."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["SPY"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 50
      recurring_contribution: 50
      starting_capital: 0
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # A window that cannot hold its period refuses immediately and names
  # contribution_period_exceeds_window, instead of degrading to the generic
  # missing_rule_group refusal.
  - id: dca_capital_semantics_period_exceeds_window_named_refusal_issue_455
    prompt: "DCA $500 into AAPL quarterly, from January 2024 through February 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: needs_clarification
      assets: ["AAPL"]
      asset_class: equity
      capital_amount: 500
      contribution_period: quarterly
      requested_field: cadence
      launch_validation_code: contribution_period_exceeds_window
      stage_outcomes: ["ready_for_confirmation", "needs_clarification"]

  # A contribution of $0 beside a seed is refused as
  # dca_contribution_zero_is_buy_and_hold: the refusal says what the plan
  # actually is and asks for the amount, rather than silently reinterpreting.
  - id: dca_capital_semantics_zero_contribution_names_buy_and_hold_issue_455
    prompt: "Set up a monthly recurring plan on SPY for 2024: $5,000 to start and $0 added each month."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: needs_clarification
      assets: ["SPY"]
      asset_class: equity
      requested_field: capital_amount
      launch_validation_code: dca_contribution_zero_is_buy_and_hold
      stage_outcomes: ["ready_for_confirmation", "needs_clarification"]

  # Review round 1 finding 2 regression: calendar alignment moves the served
  # start off the January 1 holiday, and the period fit is still measured
  # against the window the user asked for, so "January 2024, monthly" is
  # executable rather than refused for being one day short of its own month.
  # This is also the interpret-path facet of the non-trading-day rule: the
  # contribution that falls on the holiday buys on the next session instead
  # of invalidating the plan.
  - id: dca_capital_semantics_calendar_alignment_keeps_period_fit_issue_455
    prompt: "DCA $200 into AAPL monthly for January 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["AAPL"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-01-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-01-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 200
      recurring_contribution: 200
      starting_capital: 0
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # Blind spot: the lane's own guard exercised one plan shape. A multi-symbol
  # equal-weight recurring plan must carry the same two roles once, not per
  # symbol.
  - id: dca_capital_semantics_multi_symbol_equal_weight_issue_455
    prompt: "DCA $300 every month across AAPL, MSFT, and NVDA, from January 2024 through December 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["AAPL", "MSFT", "NVDA"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 300
      recurring_contribution: 300
      starting_capital: 0
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # Blind spot: crypto. Weekly contributions into BTC follow the same plan
  # contract with the crypto benchmark default.
  - id: dca_capital_semantics_crypto_weekly_btc_issue_455
    prompt: "DCA $100 into Bitcoin every week, from January 2024 through December 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["BTC"]
      asset_class: crypto
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      benchmark_symbol: BTC
      capital_amount: 100
      recurring_contribution: 100
      starting_capital: 0
      contribution_period: weekly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # Blind spot: a provider-truncated window. RDDT listed 2024-03-21, so the
  # requested January-May window holds a quarter but the served window does
  # not. Truncation is not calendar alignment, so the period fit must be
  # measured against the served window and refused, not waved through on the
  # strength of the ask.
  - id: dca_capital_semantics_truncated_window_measures_served_issue_455
    prompt: "DCA $500 into Reddit quarterly, from January 2024 through May 2024."
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: needs_clarification
      assets: ["RDDT"]
      asset_class: equity
      capital_amount: 500
      contribution_period: quarterly
      requested_field: cadence
      stage_outcomes: ["ready_for_confirmation", "needs_clarification"]

  # Both money roles survive Spanish phrasing: the seed stays the seed and
  # "cada mes" resolves to the same typed period, so the one-phrase rendering
  # in either language reads off identical typed facts.
  - id: dca_capital_semantics_spanish_seed_and_contribution_issue_455
    prompt: "Empieza con $1,000 en SPY y aporta $200 cada mes, de enero 2024 a diciembre 2024."
    user_language: es-419
    ui_language: es-419
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["SPY"]
      asset_class: equity
      strategy_type: dca_accumulation
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      capital_amount: 200
      recurring_contribution: 200
      starting_capital: 1000
      contribution_period: monthly
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  # The named refusal is language-independent: a Spanish quarterly plan in a
  # two-month window refuses with the same typed code.
  - id: dca_capital_semantics_spanish_period_exceeds_window_issue_455
    prompt: "Aporta $500 a AAPL cada trimestre, de enero 2024 a febrero 2024."
    user_language: es-419
    ui_language: es-419
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: needs_clarification
      assets: ["AAPL"]
      asset_class: equity
      capital_amount: 500
      contribution_period: quarterly
      requested_field: cadence
      launch_validation_code: contribution_period_exceeds_window
      stage_outcomes: ["ready_for_confirmation", "needs_clarification"]

  # The prebaked-chip contract (front-page chip q3): the chip carries the
  # full ask (KO, monthly cadence, a five-year window) and the only follow-up
  # is the amount. Any reasonable answer, including a trailing-currency
  # "200$", must reach the confirmation card with every chip fact intact.
  # Production 2026-08-19: this exact turn died in the no-progress fallback
  # after the budget audit re-roled the amount and the replay detector
  # discarded the audited turn as a replay.
  - id: dca_capital_semantics_prebaked_chip_bare_amount_reaches_ready_to_run
    prompt: "What if I had bought Coca-Cola every month for five years?"
    followup_prompt: "200$"
    user_language: en
    ui_language: en
    snapshot:
      latest_task_type: strategy_drafting
      completed: false
      pending_needs: ["sizing_amount"]
      last_unresolved_follow_up: "How much should I use?"
      pending_strategy:
        strategy_type: dca_accumulation
        strategy_thesis: "Buy Coca-Cola every month for the last five years."
        asset_universe: ["KO"]
        asset_class: equity
        cadence: monthly
        date_range:
          start: "2021-08-19"
          end: "2026-08-19"
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["KO"]
      asset_class: equity
      strategy_type: dca_accumulation
      capital_amount: 200
      contribution_period: monthly
      stage_outcomes:
        ["needs_clarification", "await_user_reply", "ready_for_confirmation", "await_approval"]

  # The Spanish twin of the chip contract, answered the way the production
  # user answered it. There is no FX layer; the number funds the plan as-is.
  - id: dca_capital_semantics_prebaked_chip_spanish_pesos_reaches_ready_to_run
    prompt: "¿Y si hubiera comprado Coca-Cola cada mes durante cinco años?"
    followup_prompt: "13,000 pesos"
    user_language: es-419
    ui_language: es-419
    snapshot:
      latest_task_type: strategy_drafting
      completed: false
      pending_needs: ["sizing_amount"]
      last_unresolved_follow_up: "¿Cuánto debería usar?"
      pending_strategy:
        strategy_type: dca_accumulation
        strategy_thesis: "Comprar Coca-Cola cada mes durante los últimos cinco años."
        asset_universe: ["KO"]
        asset_class: equity
        cadence: monthly
        date_range:
          start: "2021-08-19"
          end: "2026-08-19"
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["KO"]
      asset_class: equity
      strategy_type: dca_accumulation
      capital_amount: 13000
      contribution_period: monthly
      stage_outcomes:
        ["needs_clarification", "await_user_reply", "ready_for_confirmation", "await_approval"]
