        ["honesty", "spanish_language_integrity", "no_raw_runtime_error"]

  - id: asset_discovery_not_direct_backtest_issue_244
    # A direct request to test a named asset is never asset_discovery. The
    # executable confirmation pipeline is the misroute proof: the discovery
    # route can only produce ready_to_respond with no confirmation leg.
    prompt: "backtest CRWD buy and hold from Jan 2024 through Dec 2024"
    user_language: en
    ui_language: en
    expected:
      intent: ["backtest_execution", "strategy_drafting"]
      capability_verdict: executable
      assets: ["CRWD"]
      asset_class: equity
      strategy_type: buy_and_hold
      date_range:
        start: "2024-01-01"
        end: "2024-12-31"
      effective_date_range:
        start: "2024-01-02"
        end: "2024-12-31"
      adjustment_reason: calendar_alignment
      benchmark_symbol: SPY
      stage_outcomes: ["ready_for_confirmation", "await_approval"]

  - id: asset_discovery_not_result_followup_issue_244
    prompt: "ok what should I try next?"
    user_language: en
    ui_language: en
    recent_thread_history:
      - role: user
        content: "What if I just bought and held Apple through 2024?"
      - role: assistant
        content: "Here is your completed buy-and-hold result for AAPL over 2024."
    thread_metadata:
      latest_task_type: results_explanation
      last_stage_outcome: ready_to_respond
    snapshot:
      latest_task_type: results_explanation
      completed: true
      latest_backtest_result_reference:
        artifact_kind: backtest_result
        artifact_id: "eval-run-244-next"
        artifact_status: completed
        metadata:
          run_id: "eval-run-244-next"
          asset_class: equity
          symbols: ["AAPL"]
          benchmark_symbol: SPY
          config_snapshot:
            template: buy_and_hold
            symbols: ["AAPL"]
            date_range:
              start: "2024-01-01"
              end: "2024-12-31"
    expected:
      # Intent label is model-shape; the act boundary keeps the ordinary
      # post-result "what next" turn out of the discovery route.
      intent: ["conversation_followup", "results_explanation"]
      capability_verdict: answer_only
      semantic_turn_act: result_followup
      stage_outcomes: ["ready_to_respond"]

  - id: asset_discovery_not_capability_question_issue_244
    prompt: "does argus support finding new stocks to invest in?"
    user_language: en
    ui_language: en
    expected:
      # Intent label is model-shape; asking what Argus supports stays an
      # educational turn instead of invoking the discovery route.
      intent: ["conversation_followup", "beginner_guidance"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
