  - id: asset_discovery_recent_ipo_exact_issue_344
    prompt: "find me stocks that have recently IPO'ed"
    user_language: en
    ui_language: en
    expected:
      intent: conversation_followup
      capability_verdict: answer_only
      semantic_turn_act: asset_discovery
      asset_discovery:
        relationship: category
        anchor_symbols: []
        asset_class_hint: equity
        category_description_includes_any: ["ipo", "public"]
        needs_current_facts: true
      stage_outcomes: ["ready_to_respond"]
      # A discovery turn that names nothing and offers
      # nothing is a dead end, however it routed.
      offered:
        actionable: true
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]

  - id: asset_discovery_trending_crypto_exact_issue_344
    prompt: "find me cryptos that are trending"
    user_language: en
    ui_language: en
    expected:
      intent: conversation_followup
      capability_verdict: answer_only
      semantic_turn_act: asset_discovery
      asset_discovery:
        relationship: category
        anchor_symbols: []
        asset_class_hint: crypto
        category_description_includes_any: ["trend", "crypto"]
        needs_current_facts: true
      stage_outcomes: ["ready_to_respond"]
      # This case passed both promotion runs while the live reply named
      # nothing and offered nothing. Routing was never the failure.
      offered:
        actionable: true
        min_discovery_rows: 1
        # The founder-facing symptom: a reply that found real names, could
        # not offer them, and said none of it. Naming the drop is the
        # difference between a dead end and progress.
        names_unavailable: true
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]

