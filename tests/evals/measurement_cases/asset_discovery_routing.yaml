# Grounded Discovery classification battery (issue #244). The routing
# boundary is semantic_turn_act=asset_discovery plus its typed payload; the
# composer keys on the act alone, so intent labels stay tolerant lists where
# they are model-shape. Stage outcome is ready_to_respond on both the
# flag-off recovery path and the flag-on search path, so these cases hold in
# any sanctioned environment.
category: asset_discovery_routing
cases:
  - id: asset_discovery_category_english_issue_244
    prompt: "what cybersecurity stocks could I test?"
    user_language: en
    ui_language: en
    expected:
      intent: conversation_followup
      capability_verdict: answer_only
      semantic_turn_act: asset_discovery
      asset_discovery:
        relationship: category
        anchor_symbols: []
        category_description_includes_any: ["cybersecurity", "cyber"]
      stage_outcomes: ["ready_to_respond"]
      # A discovery turn that names nothing and offers
      # nothing is a dead end, however it routed.
      offered:
        actionable: true
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]

  - id: asset_discovery_peer_anchor_english_issue_244
    prompt: "find companies similar to Nvidia that I could test"
    user_language: en
    ui_language: en
    expected:
      intent: conversation_followup
