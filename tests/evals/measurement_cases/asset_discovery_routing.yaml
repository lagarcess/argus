  - id: asset_discovery_spanish_generated_pharma_escalation_issue_344
    # Exact es-419 action emitted by the general-knowledge discovery sidecar.
    # Bilingual acceptance requires this ordinary natural-language turn to
    # retain the same typed current-fact route as its English equivalent.
    prompt: "Buscar acciones actuales para esta categoría: acciones farmacéuticas"
    user_language: es
    ui_language: es-419
    recent_thread_history:
      - role: user
        content: "busca acciones farmacéuticas"
      - role: assistant
        content: "Aquí tienes acciones farmacéuticas de conocimiento general, no de una búsqueda actual."
    expected:
      intent: conversation_followup
      capability_verdict: answer_only
      semantic_turn_act: asset_discovery
      asset_discovery:
        relationship: category
        anchor_symbols: []
        asset_class_hint: equity
