# Ordinary conversation turns: the shapes the backtest guardrails used to
# re-read on every turn (subtract-the-guardrails lane, PR #565). A concept
# question, a capability question phrased as education, and a market
# curiosity question must each reach an honest answer in the user's language
# without a clarification interrogation. The scorecard's route receipts show
# which second reads ran; these cases are the only live turns that exercise
# the narrowed gates at their edges.
category: ordinary_conversation
cases:
  - id: ordinary_conversation_concept_compound_interest_en
    prompt: "What is compound interest?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: ordinary_conversation_concept_inflation_es
    # The #563 turn that lost its composer to the audit chain and shipped an
    # English recovery text on a Spanish turn.
    prompt: "¿Qué significa inflación?"
    user_language: es-419
    ui_language: es-419
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "spanish_language_integrity", "no_raw_runtime_error"]
  - id: ordinary_conversation_concept_etf_es
    prompt: "¿Qué es un ETF?"
    user_language: es-419
    ui_language: es-419
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "spanish_language_integrity", "no_raw_runtime_error"]
  - id: ordinary_conversation_capability_indicator_question_en
    # A capability question the capability audit used to catch when the
    # primary read left the focus unset; the primary now owns the focus.
    prompt: "Can I use Bollinger Bands in a rule?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain", "calculate"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: ordinary_conversation_capability_indicator_question_es
    prompt: "¿Puedo usar bandas de Bollinger en una regla?"
    user_language: es-419
    ui_language: es-419
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain", "calculate"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "spanish_language_integrity", "no_raw_runtime_error"]
  - id: ordinary_conversation_macro_curiosity_en
    # Market curiosity the context audit used to relabel; with the research
    # rail on, the primary read's question shape owns it.
    prompt: "what's happening with inflation right now?"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
      intent: ["follow_up", "explain", "cannot"]
      tool_dispatch: true
      capability_verdict: answer_only
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
  - id: ordinary_conversation_price_question_en
    # The founder's own test for the open-the-gates lane (2026-09-10): a
    # price question is answered with whatever the provider returned, never
    # withheld by a rule. The rail used to withhold the quote whenever the
    # model's citation was not the page the response retrieved, and the
    # refusal still reached ready_to_respond, so only the typed sidecar can
    # see it: `published` is the absence of a degraded code. Whether the
    # provider delivers a figure on a given run is its own to deliver, so
    # no row floor is pinned here.
    prompt: "what's the price of nike today"
    user_language: en
    ui_language: en
    expected:
      offered:
        response: true
      intent: ["conversation_followup", "beginner_guidance", "unsupported_or_out_of_scope"]
      capability_verdict: answer_only
      stage_outcomes: ["ready_to_respond"]
      research:
        published: true
    prose_judge:
      criteria: ["honesty", "no_raw_runtime_error"]
