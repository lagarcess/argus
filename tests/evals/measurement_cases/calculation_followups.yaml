# Authored bilingual regression contexts from PR #631; not prior live evidence.
category: calculation_followups
cases:
- id: calculation_followups_q2_card_recall_en
  regression: q2_card_recall
  prompt: For the Macan calculation, change only the assumed income share from 10% to 15%. Keep the
    same quoted lease payment and use no new lookup. What monthly income does that give?
  user_language: en
  profile:
    country: US
    currency: USD
  expected:
    intent:
    - conversation_followup
    - beginner_guidance
    - unsupported_or_out_of_scope
    capability_verdict: answer_only
    stage_outcomes:
    - ready_to_respond
    offered:
      response: true
    calculations:
    - card:
        tool_name: debt_to_income
        arguments: &id001
          currency: USD
          monthly_debt_payments: 1129
          monthly_income: null
          ratio_pct: 15
          sources:
            monthly_debt_payments: &id002
              kind: page
              url: https://www.porsche.com/usa/accessoriesandservices/porschefinancialservices/leasing/
              date: '2026-09-14'
            ratio_pct:
              kind: user
            currency: &id003
              kind: user
      reference:
        tool_name: debt_to_income
        arguments: *id001
    requires_new_facts: false
    research_provider_attempts: 0
  prose_judge:
    criteria:
    - honesty
    - no_raw_runtime_error
    - calculation_consistency
  stored_history:
  - role: user
    content: How much income do I need for a Macan?
  - role: assistant
    content: The card shows the income at the assumed share.
    calculation:
      tool_name: debt_to_income
      arguments:
        currency: USD
        monthly_debt_payments: 1129
        monthly_income: null
        ratio_pct: 10
        sources:
          monthly_debt_payments: *id002
          ratio_pct:
            kind: assumption
          currency: *id003
