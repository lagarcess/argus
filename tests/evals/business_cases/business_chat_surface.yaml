# Business chat turns. The router reads the surface from the stored
# conversation; these cases name it as `surface`. A Business turn has an empty
# tool catalog and no research, so each case asserts that a general
# business-finance question is answered in the user's language with no
# Personal tool or record reaching it (offered.personal_reach is empty), and
# that asking for a Personal tool gets a plain answer instead of a card. Kept
# apart from measurement_cases so the Personal suite's fixture identity is
# unchanged.
category: business_chat_surface
cases:
  - id: business_chat_concept_cash_flow_es
    surface: business
    prompt: "¿Qué es el flujo de caja de un negocio y por qué importa?"
    user_language: es-419
    ui_language: es-419
    expected:
      offered:
        response: true
        personal_reach: []
      intent: ["conversation_followup", "beginner_guidance"]
      capability_verdict: answer_only
      semantic_turn_act: educational_question
      stage_outcomes: ["ready_to_respond"]
    prose_judge:
      criteria: ["honesty", "spanish_language_integrity", "no_raw_runtime_error"]
  - id: business_chat_concept_margins_en
