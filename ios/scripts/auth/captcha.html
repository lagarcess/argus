<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local security check</title>
<style>body{font:17px system-ui;padding:24px;color:#191c1f;background:#fff}p{line-height:1.5}</style>
<script>
function send(message) { window.webkit?.messageHandlers.argusCaptcha.postMessage(message); }
function ready() {
 const mode = 'LOCAL_TEST_MODE';
 if (mode === 'hold') return;
 const key = mode === 'fail' ? '2x00000000000000000000AB' : '1x00000000000000000000AA';
 turnstile.render('#challenge', {sitekey:key, callback:token=>send({type:'token',token}),
  'error-callback':()=>send({type:'error'}), 'expired-callback':()=>send({type:'error'}),
  'timeout-callback':()=>send({type:'error'}), retry:'never'});
}
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=ready&render=explicit" async defer></script>
</head><body><p>Local test security check. Uses Cloudflare's public test keys, not a production challenge.</p><div id="challenge"></div></body></html>
