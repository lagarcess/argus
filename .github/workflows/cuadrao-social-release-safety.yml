name: Cuadrao social release safety
on:
  pull_request:
    paths:
      - 'ios/Config/**'
      - 'ios/ArgusFoundation.xcodeproj/**'
      - 'ios/ArgusFoundation/Auth/**'
      - 'ios/DesignPreviewTests/run_native_provider_config.py'
      - 'ios/DesignPreviewTests/run_social_release_settings.py'
      - '.github/workflows/cuadrao-social-release-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-release-safety:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic provider configuration
        run: python3 ios/DesignPreviewTests/run_native_provider_config.py
      - name: Verify Release ignores local social flags
        run: python3 ios/DesignPreviewTests/run_social_release_settings.py
