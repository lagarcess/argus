name: Clara local pilot

on:
  push:
    branches: ["codex/money-placement-pilot-impl"]
    paths: ["money-view/**", ".github/workflows/money-view.yml"]
  pull_request:
    branches: ["codex/money-placement-pilot"]
    paths: ["money-view/**", ".github/workflows/money-view.yml"]

permissions:
  contents: read

concurrency:
  group: clara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: money-view
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -c pytest.ini tests -q
      - run: python -m ruff check server tests
      - run: bun install --frozen-lockfile
        working-directory: money-view/web
      - run: bun run build
        working-directory: money-view/web
      - run: bunx playwright install --with-deps chromium
        working-directory: money-view/web
      - run: bun run test:e2e
        working-directory: money-view/web
        env:
          CLARA_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clara-browser-evidence
          path: |
            money-view/docs/evidence
            money-view/web/test-results
