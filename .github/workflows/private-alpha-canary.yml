name: Private Alpha Canary

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: read

concurrency:
  group: private-alpha-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ARGUS_WARMUP_EXPECT_MODE: real-workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Render promotes main, so scheduled canaries bootstrap from that
          # branch. Before any checks run, the workflow resolves and checks out
          # the coherent SHA deployed by API, web, workflow, and maintenance.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Render CLI
        run: |
          tmpdir="$(mktemp -d)"
          curl -fsSL https://github.com/render-oss/cli/releases/download/v2.20.0/cli_2.20.0_linux_amd64.zip -o "$tmpdir/render.zip"
          unzip -q "$tmpdir/render.zip" -d "$tmpdir"
          sudo mv "$tmpdir/cli_v2.20.0" /usr/local/bin/render
          render --version

      - name: Resolve deployed canary release
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          api_status="$(RENDER_API_KEY="$RENDER_API_KEY" .github/render-env-sync.sh api-deploy-status)"
          web_status="$(RENDER_API_KEY="$RENDER_API_KEY" .github/render-env-sync.sh web-deploy-status)"
          workflow_status="$(RENDER_API_KEY="$RENDER_API_KEY" .github/render-env-sync.sh workflow-version-status)"
          cron_status="$(RENDER_API_KEY="$RENDER_API_KEY" .github/render-env-sync.sh cron-deploy-status)"
          deployed_sha="$(python3 .github/canary-deployed-sha.py \
            --api-status "$api_status" \
            --web-status "$web_status" \
            --workflow-status "$workflow_status" \
            --cron-status "$cron_status")"
          git cat-file -e "${deployed_sha}^{commit}"
          git checkout --detach "$deployed_sha"
          candidate_sha="$(git rev-parse HEAD)"
          if [ "$candidate_sha" != "$deployed_sha" ]; then
            echo "ERROR: canary deployed checkout did not resolve exactly" >&2
            exit 1
          fi
          echo "canary_candidate_sha=$candidate_sha"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Install Chromium for the deployed browser canary
        run: cd web && bunx playwright install --with-deps chromium

      - name: Run Spanish static UI canary assertions
        run: cd web && bun test __tests__/spanish-ui-smoke.test.ts

      - name: Run local predeploy smoke
        run: .github/local-smoke.sh --expected-sha "$(git rev-parse HEAD)"

      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ARGUS_OPS_TOKEN: ${{ secrets.ARGUS_OPS_TOKEN }}
          ARGUS_WORKFLOW_DATABASE_URL: ${{ secrets.ARGUS_WORKFLOW_DATABASE_URL }}
          ARGUS_CANARY_EMAIL: ${{ secrets.ARGUS_CANARY_EMAIL }}
          ARGUS_CANARY_PASSWORD: ${{ secrets.ARGUS_CANARY_PASSWORD }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          for name in \
            RENDER_API_KEY \
            ARGUS_OPS_TOKEN \
            ARGUS_WORKFLOW_DATABASE_URL \
            ARGUS_CANARY_EMAIL \
            ARGUS_CANARY_PASSWORD \
            ARGUS_CANARY_SUPABASE_URL \
            ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required private-alpha canary secrets:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare canary evidence directory
        run: |
          mkdir -p temp/canary-evidence
          umask 077
          : > temp/canary-evidence/es-419-capture.json
          rm -f temp/canary-evidence/es-419-capture.json

      - name: Warm Render product path
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ARGUS_OPS_TOKEN: ${{ secrets.ARGUS_OPS_TOKEN }}
          ARGUS_WORKFLOW_DATABASE_URL: ${{ secrets.ARGUS_WORKFLOW_DATABASE_URL }}
        run: .github/warmup-render.sh --expect-mode real-workflow

      - name: Run authoritative Spanish release canary
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ARGUS_OPS_TOKEN: ${{ secrets.ARGUS_OPS_TOKEN }}
          ARGUS_WORKFLOW_DATABASE_URL: ${{ secrets.ARGUS_WORKFLOW_DATABASE_URL }}
          ARGUS_CANARY_EMAIL: ${{ secrets.ARGUS_CANARY_EMAIL }}
          ARGUS_CANARY_PASSWORD: ${{ secrets.ARGUS_CANARY_PASSWORD }}
          ARGUS_CANARY_SUPABASE_URL: ${{ secrets.ARGUS_CANARY_SUPABASE_URL }}
          ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ARGUS_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          ARGUS_CANARY_SHA="$(git rev-parse HEAD)" \
          ARGUS_CANARY_EVIDENCE_PATH=temp/canary-evidence/es-419.json \
          ARGUS_CANARY_CAPTURE_PATH=temp/canary-evidence/es-419-capture.json \
          .github/canary-render.sh
          status=$?
          echo "$status" > temp/canary-evidence/es-419.exit
          exit "$status"

      - name: Require authoritative private-alpha canary
        if: always()
        run: |
          failed=0
          status_file="temp/canary-evidence/es-419.exit"
          if [ ! -f "$status_file" ]; then
            echo "canary_locale_es-419_exit=missing"
            exit 1
          fi
          status="$(cat "$status_file")"
          echo "canary_locale_es-419_exit=$status"
          if [ "$status" != "0" ]; then failed=1; fi
          exit "$failed"

      - name: Upload human-safe canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-canary-evidence
          path: |
            temp/canary-evidence/es-419.json
            temp/canary-evidence/es-419.exit
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed canary capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-canary-failure-capture
          path: temp/canary-evidence/es-419-capture.json
          if-no-files-found: warn
          retention-days: 30

      # The canary script masks its own credentials out of the browser artifacts
      # and drops this marker. A deployed tree without that pass leaves no
      # marker, so the upload below is skipped instead of publishing raw input
      # values. That keeps this step free of canary secrets.
      - name: Check browser canary context redaction
        id: browser_context
        if: always()
        run: |
          if [ -f web/temp/playwright-results/.redacted ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "browser_context_upload=skipped_unredacted"
          fi

      - name: Upload browser canary failure context
        if: failure() && steps.browser_context.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-alpha-canary-browser-context
          path: web/temp/playwright-results/**
          if-no-files-found: ignore
          retention-days: 30
