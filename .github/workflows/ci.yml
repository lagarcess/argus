name: CI

"on":
  push:
    branches: [main, "codex/**", "jules/**"]
  pull_request:
    branches: [main, "codex/private-alpha-next", "codex/private-alpha-next-jules-intake"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/codex/private-alpha-next' && github.ref != 'refs/heads/codex/private-alpha-next-jules-intake' }}

jobs:
  ownership-gate:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run branch ownership gate
        run: python .agent/scripts/ownership/verify_branch_ownership.py

  backend-checks:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Lint backend, tests, scripts, and workflows
        run: poetry run ruff check src tests workflows scripts

      - name: Check modularity budget
        run: poetry run python scripts/check_modularity_budget.py

      # Directory-level so new test files are gated without editing this workflow.
      - name: Run backend regression suite
        run: poetry run pytest tests -q --no-cov

  frontend-checks:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      # next build does not lint, so without this the ESLint ban that keeps
      # browser state behind lib/browser-storage.ts is not a gate at all.
      - name: Lint frontend
        run: cd web && bun run lint

      - name: Run frontend tests
        run: cd web && bun test

      - name: Build frontend
        run: cd web && bun run build

      # Observation backstop for the browser-storage disclosure. The chokepoint
      # and the ESLint ban stop accidents; this catches a deliberate bypass by
      # watching what a real browser actually keeps. One spec, not the suite.
      - name: Install Playwright chromium
        run: cd web && bunx playwright install --with-deps chromium

      - name: Verify browser storage matches the privacy disclosure
        run: cd web && bunx playwright test e2e/browser-storage-disclosure.spec.ts

  guest-release-gates:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      OPENROUTER_API_KEY: ""
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      ARGUS_MARKET_DATA_PROVIDER_MODE: synthetic_unit_fixture
      ARGUS_MOCK_AUTH: "false"
      NEXT_PUBLIC_MOCK_AUTH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install backend dependencies
        run: poetry install --with dev,workflows --no-interaction

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start disposable local Supabase and reset migrations
        run: |
          supabase start
          supabase db reset
          eval "$(supabase status -o env)"
          {
            echo "ARGUS_DISPOSABLE_DATABASE_URL=$DB_URL"
            echo "ARGUS_LOCAL_SUPABASE_URL=$API_URL"
            echo "ARGUS_LOCAL_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "ARGUS_LOCAL_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run provider-free guest backend tests
        run: |
          poetry run pytest \
            tests/evals/test_chat_runtime_trajectory_harness.py \
            tests/test_allowance_accounting.py \
            tests/test_guest_access_policy.py \
            tests/test_guest_allowance_accounting.py \
            tests/test_guest_auth.py \
            tests/test_guest_cleanup.py \
            tests/test_guest_conversation_policy.py \
            tests/test_guest_conversion.py \
            tests/test_guest_observability.py \
            -q --no-cov

      # Glob-level so a new _postgres proof is gated without editing this
      # workflow; a hand-maintained list is how uncovered tables ship green.
      - name: Run required real-PostgreSQL matrix
        run: |
          poetry run pytest \
            tests/test_*_postgres.py \
            --junitxml=temp/guest-postgres-junit.xml \
            -q --no-cov
          poetry run python scripts/qa/assert_pytest_gate.py \
            temp/guest-postgres-junit.xml

      - name: Run required local anonymous Auth matrix
        run: |
          poetry run pytest \
            tests/test_guest_auth_local_supabase.py \
            --junitxml=temp/guest-auth-junit.xml \
            -q --no-cov
          poetry run python scripts/qa/assert_pytest_gate.py \
            temp/guest-auth-junit.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Run guest frontend tests
        run: |
          cd web
          bun test \
            __tests__/guest-analytics.test.ts \
            __tests__/guest-artifact-hints.test.tsx \
            __tests__/guest-browser-harness.test.ts \
            __tests__/guest-capability-gates.test.ts \
            __tests__/guest-conversion.test.ts \
            __tests__/guest-modal-viewport-fit.test.ts \
            __tests__/guest-session.test.ts \
            __tests__/guest-shell.test.tsx \
            __tests__/guest-starter-actions.test.tsx \
            __tests__/usage-allowance.test.ts

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    needs:
      - ownership-gate
      - backend-checks
      - frontend-checks
      - guest-release-gates
    steps:
      - name: All checks passed
        run: echo "CI checks passed."
