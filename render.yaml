services:
  - type: web
    name: argus-api
    runtime: python
    repo: https://github.com/lagarcess/argus
    branch: main
    rootDir: .
    region: virginia
    plan: standard
    autoDeployTrigger: off
    buildCommand: poetry config virtualenvs.create false && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn argus.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: POETRY_VERSION
        value: "2.1.3"
      - key: ARGUS_PERSISTENCE_MODE
        value: supabase
      - key: ARGUS_DEV_MEMORY_FALLBACK
        value: "false"
      - key: ARGUS_MARKET_DATA_PROVIDER_MODE
        value: live_provider
      - key: MARKET_DATA_CACHE_TTL
        value: "43200"
      - key: ARGUS_RUNTIME_EVENT_TIMEOUT_SECONDS
        value: "180"
      - key: ARGUS_RUNTIME_EVENT_KEEPALIVE_SECONDS
        value: "15"
      - key: ARGUS_CHECKPOINTER_MODE
        value: postgres
      - key: ARGUS_MOCK_AUTH
        value: "false"
      - key: ARGUS_CORS_ALLOW_ORIGINS
        value: https://argus-app-suz5.onrender.com
      - key: ARGUS_APP_ORIGIN
        value: https://argus-app-suz5.onrender.com
      - key: ARGUS_BACKTEST_JOBS_SHADOW_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_JOBS_DISPATCH_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_WORKFLOW_TASK
        value: argus-backtests/workflow_proof
      - key: ARGUS_BACKTEST_WORKFLOW_EXECUTION_ENABLED
        value: "true"
      - key: ARGUS_BACKTEST_REAL_WORKFLOW_TASK
        value: argus-backtests/run_backtest_job
      - key: ARGUS_BACKTEST_JOBS_USER_RUNNING_LIMIT
        value: "1"
      - key: ARGUS_BACKTEST_JOBS_USER_QUEUED_LIMIT
        value: "2"
      - key: ARGUS_BACKTEST_JOBS_GLOBAL_RUNNING_LIMIT
        value: "5"
      - key: ARGUS_BACKTEST_JOBS_GLOBAL_QUEUED_LIMIT
        value: "10"
      - key: ARGUS_EVIDENCE_RECEIPT_SHARING_ENABLED
        value: "false"
      - key: ARGUS_CONTEXT_PACKETS_ENABLED
        value: "true"
      - key: ARGUS_CONTEXT_PACKET_BUDGET_SECONDS
        value: "4"
      - key: ARGUS_TITLE_AUTOGEN_ENABLED
        value: "true"
      - key: ARGUS_TITLE_AUTOGEN_TIMEOUT_MS
        value: "250"
      - key: ARGUS_READINESS_ASSET_TIMEOUT_SECONDS
        value: "25"
      - key: ARGUS_OPS_TOKEN
        sync: false
      - key: ARGUS_VISITOR_KEY_SECRET
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: POSTHOG_PROJECT_TOKEN
        sync: false
      - key: POSTHOG_REGION
        value: us
      - key: ARGUS_ENABLE_EXECUTION_REALISM
        value: "true"
      - key: ARGUS_ENABLE_PERSONALIZATION_MEMORY
        value: "false"
      - key: ARGUS_RESEARCH_RAIL_ENABLED
        value: "false"
      - key: ARGUS_RESEARCH_GLOBAL_DAILY_CEILING
        value: "5000"
      - key: ARGUS_ENABLE_MEMORY_SEMANTIC_RECALL
        value: "false"
      - key: ARGUS_MEMORY_EMBEDDING_MODEL
        value: pplx-embed-v1-0.6b
      - key: ARGUS_MEMORY_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: ARGUS_MEMORY_EMBEDDING_TIMEOUT_SECONDS
        value: "8.0"
      - key: ARGUS_MEMORY_VECTOR_COLLECTION
        value: argus_memory_vectors
      - key: ARGUS_DISCOVERY_SEARCH_PROVIDER
        value: perplexity_direct
      - key: ARGUS_APPROVAL_EMAIL_SMTP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://lgdhvepyrzbnscqssgqq.supabase.co
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZGh2ZXB5cnpibnNjcXNzZ3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2NzkwOTksImV4cCI6MjA4ODI1NTA5OX0.mc7KjmJYuAp01Mj96gceGsAW2UPI2_HQsv0_kyWaQmo
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: ARGUS_PROD_OPENROUTER_API_KEY
