      - key: ARGUS_CHAT_FALLBACK_MODEL
        value: qwen/qwen3.5-9b
      - key: ARGUS_OPENROUTER_RESULT_SUMMARY_TIMEOUT_SECONDS
        value: "30"
      - key: ARGUS_STRUCTURED_MODEL
        value: x-ai/grok-4.3
      - key: ARGUS_STRUCTURED_FALLBACK_MODEL
        value: anthropic/claude-haiku-4.5
