    ConfirmationDirectEditRequest:
      properties:
        capital:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
        date_window:
          anyOf:
          - $ref: '#/components/schemas/ConfirmationDirectEditWindow'
          - type: 'null'
        fee_rate:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
        slippage:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
      type: object
      description: 'Edit the pending confirmation''s capital, dates, or costs without a turn.


        At least one field is required. Capital is the starting capital, or the

        recurring contribution when the pending strategy is a recurring-buy plan,

        matching the money-role semantics of the conversational path. Costs are

        decimal rates (0.002 is 0.2 percent); zero explicitly clears a cost. The

        slippage cap is enforced by the shared edit resolver, not re-stated here.'
    ConfirmationDirectEditResponse:
      properties:
        message:
          $ref: '#/components/schemas/Message'
      type: object
      required:
      - message
    ConfirmationDirectEditWindow:
      properties:
        start:
          type: string
          maxLength: 10
          minLength: 10
        end:
          type: string
          maxLength: 10
          minLength: 10
      type: object
      required:
      - start
      - end
      description: 'Explicit calendar endpoints from the drawer''s date inputs.


        Direct edits are deterministic UI values, never prose: relative or

        semantic windows stay on the conversational path where the interpreter

        owns them.'
    ConfirmationPeerAssetsRequest:
      properties:
        symbols:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 4
            minItems: 1
          - type: 'null'
        restore_previous:
          type: boolean
          default: false
      type: object
      description: 'Grow or restore the pending confirmation''s basket without a turn.


        Add mode: only symbols the active turn offered as research peer rows are

        addable; the backend re-verifies each against the resolver and coverage

        gates. Restore mode undoes the latest add by re-materializing the exact

        previous asset set from the card''s own typed adjustment data.'
    ConfirmationPeerAssetsResponse:
      properties:
        message:
          $ref: '#/components/schemas/Message'
      type: object
      required:
      - message
