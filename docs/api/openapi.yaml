          - queued
          - running
          - succeeded
          - failed
          - canceled
          - expired
        result_run_id:
          anyOf:
          - type: string
          - type: 'null'
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
        failure_detail:
          anyOf:
          - type: string
          - type: 'null'
