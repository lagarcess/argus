openapi: 3.1.0
info:
  title: Argus Alpha API
  version: 1.0.0-alpha
  description: Contract-first Alpha API for chat-first investing idea validation.
servers:
  - url: /api/v1
paths:
  /api/v1/auth/signup:
    post:
      responses:
        "200":
          description: Account created or mocked in development.
  /api/v1/auth/login:
    post:
      responses:
        "200":
          description: Session created. When a server-cookie-bound guest handoff exists, the product graph is claimed before the session response and `guest_claim` returns the original conversation plus optional typed pending action.
  /api/v1/auth/guest:
    post:
      description: Create or reuse one verified anonymous guest session when server policy permits it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestBootstrapRequest"
      responses:
        "200":
          description: Guest session and temporary workspace are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBootstrapResponse"
        "403":
          description: Guest access is disabled or the browser origin is rejected.
        "429":
          description: Anonymous-session creation is temporarily rate limited.
        "503":
          description: Anonymous Auth or temporary-workspace bootstrap is unavailable.
  /api/v1/auth/guest/link:
    post:
      description: Link the verified anonymous identity to a new permanent account without changing its Auth UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestIdentityLinkRequest"
      responses:
        "200":
          description: The same Auth identity and product graph are now registered.
        "403":
          description: Public account access is disabled or the session is not an active guest.
        "409":
          description: The current session is already registered.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/auth/guest/handoffs:
    post:
      description: Create a ten-minute guest handoff bound to a normalized destination-email hash. Store its id and opaque secret only in HttpOnly cookies used by login reconciliation; account existence is not resolved at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestHandoffCreateRequest"
      responses:
        "201":
          description: A single-use guest handoff is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestHandoffCreateResponse"
        "401":
          description: The destination account is unavailable or not permitted.
        "409":
          description: The current session is already registered.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/auth/guest/handoffs/{handoff_id}/claim:
    post:
      description: Atomically claim the complete guest product graph into the signed-in destination account. Browser login performs this operation before returning its permanent session; this explicit endpoint remains a strict single-use compatibility boundary.
      parameters:
        - name: handoff_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The original conversation and optional typed action were claimed once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestHandoffClaimResponse"
        "400":
          description: The handoff cookie or secret is invalid.
        "403":
          description: The signed-in account is not the bound destination.
        "409":
          description: The handoff was consumed or the product graph is unsafe.
        "410":
          description: The handoff expired.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/auth/logout:
    post:
      responses:
        "200":
          description: Session cleared.
        "403":
          description: Untrusted browser origin rejected.
  /api/v1/auth/session:
    get:
      responses:
        "200":
          description: Current authentication state and user.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/analytics/guest-events:
    post:
      description: Capture one approved browser-owned guest funnel fact through the authenticated, same-origin server envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestFunnelClientEventRequest"
      responses:
        "200":
          description: The sanitized guest event was accepted for background capture.
        "403":
          description: The origin or verified guest account context was rejected.
        "422":
          description: The event or property combination is outside the approved contract.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/me:
    get:
      responses:
        "200":
          description: Current user profile and preferences.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    patch:
      responses:
        "200":
          description: Updated user profile and preferences.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/me/usage:
    get:
      description: Return the authenticated user's current private-alpha message and simulation allowance truth for both UTC windows.
      responses:
        "200":
          description: Backend-owned hourly and daily limit, usage, remaining capacity, exact reset times, availability, and the most restrictive window per resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAllowanceResponse"
        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Private-alpha access is unavailable for this identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Durable allowance truth is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/conversations:
    get:
      responses:
        "200":
          description: Cursor-paginated conversations.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    post:
      responses:
        "200":
          description: Created a conversation, or returned the one empty guest conversation.
        "403":
          description: A guest with accepted content must convert before creating another conversation.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    delete:
      responses:
        "200":
          description: Soft-deleted all non-deleted conversations for the user.
        "403":
          description: Guest account conversion is required for conversation management.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/conversations/guest/replace:
    post:
      description: Atomically replace the current guest conversation while preserving the anonymous identity, fixed expiry, and lifetime allowances.
      responses:
        "200":
          description: The one guest workspace is bound to the replacement empty conversation.
        "403":
          description: The session is not an active verified guest.
        "409":
          description: Replacement failed closed and the existing conversation was left unchanged.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/conversations/{id}:
    patch:
      responses:
        "200":
          description: Updated conversation title, pin, or archive state.
        "403":
          description: Guest account conversion is required for conversation management.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    delete:
      responses:
        "200":
          description: Soft-deleted conversation.
        "403":
          description: Guest account conversion is required for conversation management.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/conversations/{id}/messages:
    get:
      responses:
        "200":
          description: Cursor-paginated messages.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/chat/stream:
    post:
      responses:
        "200":
          description: >
            Server-sent token, status, title, result, and done events. Final
            payloads and persisted assistant metadata may include typed
            `recovery` and `clarification` objects so clients render localized
            degraded-fallback UI from static i18n keys instead of assistant
            prose.
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          description: >
            The selected response option is missing, mismatched, foreign to the
            owner or conversation, or no longer attached to the latest active
            assistant message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/strategies:
    get:
      responses:
        "200":
          description: Cursor-paginated strategies with strategy_surface_metrics.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    post:
      responses:
        "200":
          description: Created executable strategy.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/strategies/{id}:
    patch:
      responses:
        "200":
          description: Updated strategy metadata or metric preferences.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    delete:
      responses:
        "200":
          description: Soft-deleted strategy.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/collections:
    get:
      responses:
        "200":
          description: Cursor-paginated collections.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    post:
      responses:
        "200":
          description: Created organizational collection.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/collections/{id}:
    patch:
      responses:
        "200":
          description: Updated collection name or pin state.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
    delete:
      responses:
        "200":
          description: Soft-deleted collection.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/collections/{id}/strategies:
    post:
      responses:
        "200":
          description: Attached strategies to a collection.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/collections/{id}/strategies/{strategy_id}:
    delete:
      responses:
        "200":
          description: Detached strategy from collection.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/backtests/run:
    post:
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable client key for deduplicating direct backtest runs.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRunRequest"
      responses:
        "200":
          description: Completed Alpha backtest run.
          content:
            application/json:
              schema:
                type: object
                required: [run]
                properties:
                  run:
                    $ref: "#/components/schemas/BacktestRun"
        "400":
          description: Missing required Idempotency-Key header.
        "422":
          description: Problem Details for unsupported Alpha requests or unusable common data coverage. Coverage rejection occurs before quota admission.
        "409":
          description: The data window changed after approval and must be reviewed again.
        "503":
          description: >
            Problem Details when bounded auth-session verification is temporarily
            unavailable (`auth_session_verification_unavailable`) or market data
            is temporarily unavailable (`market_data_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/backtest-jobs/by-action/{confirmation_id}:
    get:
      parameters:
        - name: confirmation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owner-scoped durable job state for one chat Run action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestJobResponse"
        "404":
          description: No owner-scoped reservation exists for this action identity.
        "409":
          description: The action identity is linked to different immutable inputs.
        "500":
          description: Durable job or confirmation-artifact state is inconsistent.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/backtest-jobs/{id}:
    get:
      responses:
        "200":
          description: Durable async backtest job state, with linked run when available.
        "404":
          description: Job not found or inaccessible.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/backtests/{id}:
    get:
      responses:
        "200":
          description: Backtest run detail including chart and trades.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/history:
    get:
      responses:
        "200":
          description: Mixed recent activity feed.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/search:
    get:
      responses:
        "200":
          description: Global keyword search across chats, strategies, collections, runs, and typed P1 recall objects.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/evidence-artifacts/{id}/decision:
    post:
      description: Create or update the one current decision for a user-owned evidence artifact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionNoteCreate"
      responses:
        "200":
          description: Canonical current decision note and updated evidence/idea lifecycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionNoteResponse"
        "403":
          description: Guest account conversion is required to save a decision.
        "404":
          description: Evidence artifact not found or inaccessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Malformed decision payload or unsupported decision state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                type: https://api.argus.app/problems/validation-error
                title: Validation Error
                status: 422
                detail: Request validation failed.
                code: validation_error
                request_id: req_123
                context:
                  errors: []
        "500":
          description: Decision capture failed after request validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                type: https://api.argus.app/problems/decision-capture-failed
                title: Decision Capture Failed
                status: 500
                detail: Argus could not safely record that decision. Please retry in a moment.
                code: decision_capture_failed
                request_id: req_123
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
  /api/v1/feedback:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - message
              properties:
                type:
                  type: string
                  enum:
                    - bug
                    - feature
                    - general
                    - account_deletion_request
                message:
                  type: string
                  minLength: 1
                context:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Feedback accepted.
        "503":
          $ref: "#/components/responses/AuthSessionVerificationUnavailable"
components:
  responses:
    AuthSessionVerificationUnavailable:
      description: Bounded Supabase session verification is temporarily unavailable; retry without redirecting to login.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: https://api.argus.app/problems/auth-session-verification-unavailable
            title: Session Verification Unavailable
            status: 503
            detail: Argus could not verify this session. Please try again.
            code: auth_session_verification_unavailable
            request_id: req_123
  schemas:
    GuestBootstrapRequest:
      type: object
      required:
        - captcha_token
      properties:
        captcha_token:
          type: string
          minLength: 1
          maxLength: 4096
        language:
          type: string
          enum: [en, es-419]
          default: en
    GuestBootstrapResponse:
      type: object
      required:
        - authenticated
        - reused
        - renewed_after_expiry
        - public_account_access_enabled
        - account_kind
      properties:
        authenticated:
          type: boolean
          const: true
        reused:
          type: boolean
        renewed_after_expiry:
          type: boolean
          description: True only when an expired verified anonymous session was replaced with a fresh guest identity.
        public_account_access_enabled:
          type: boolean
          description: Server-owned permission to present anonymous-to-permanent account creation.
        account_kind:
          type: string
          const: guest
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        session:
          type:
            - object
            - "null"
    User:
      type: object
      required:
        - id
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: string
        email:
          type:
            - string
            - "null"
        username:
          type:
            - string
            - "null"
        display_name:
          type:
            - string
            - "null"
        language:
          type: string
          enum: [en, es-419]
        locale:
          type: string
          enum: [en-US, es-419]
        theme:
          type: string
          enum: [dark, light, system]
        is_admin:
          type: boolean
        onboarding:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GuestAccountSummary:
      type: object
      required:
        - expires_at
        - conversation_limit
        - message_limit
        - simulation_limit
        - feedback_limit
      properties:
        expires_at:
          type: string
          format: date-time
        conversation_limit:
          type: integer
          minimum: 1
          maximum: 2147483647
        message_limit:
          type: integer
          minimum: 1
          maximum: 2147483647
        simulation_limit:
          type: integer
          minimum: 1
          maximum: 2147483647
        feedback_limit:
          type: integer
          minimum: 1
          maximum: 2147483647
    AccountCapabilities:
      type: object
      required:
        - can_create_additional_conversation
        - can_manage_conversation
        - can_save_decision
        - can_manage_account
        - can_use_omnisearch
        - can_search_current_workspace
        - can_use_grounded_discovery
        - can_submit_feedback
      properties:
        can_create_additional_conversation:
          type: boolean
        can_manage_conversation:
          type: boolean
        can_save_decision:
          type: boolean
        can_manage_account:
          type: boolean
        can_use_omnisearch:
          type: boolean
        can_search_current_workspace:
          type: boolean
          description: Owner-scoped search over the current account workspace.
        can_use_grounded_discovery:
          type: boolean
          description: Server-authoritative availability of broader grounded discovery.
        can_submit_feedback:
          type: boolean
    UserResponse:
      type: object
      required:
        - user
        - account_kind
        - guest
        - capabilities
        - public_account_access_enabled
      properties:
        user:
          $ref: "#/components/schemas/User"
        account_kind:
          type: string
          enum:
            - guest
            - registered
        guest:
          anyOf:
            - $ref: "#/components/schemas/GuestAccountSummary"
            - type: "null"
        capabilities:
          $ref: "#/components/schemas/AccountCapabilities"
        public_account_access_enabled:
          type: boolean
          description: Server-authoritative permission to expose ordinary account creation.
    GuestConversionReason:
      type: string
      enum:
        - second_simulation
        - message_limit
        - save_decision
        - new_conversation
        - keep_history
    GuestPendingAction:
      type: object
      additionalProperties: false
      required:
        - reason
        - conversation_id
        - action_id
      properties:
        reason:
          $ref: "#/components/schemas/GuestConversionReason"
        conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        action_id:
          type: string
          minLength: 1
          maxLength: 128
        artifact_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
          description: Required only for save_decision.
    GuestHandoffCreateRequest:
      type: object
      additionalProperties: false
      required:
        - destination_email
        - source_conversation_id
      properties:
        destination_email:
          type: string
          format: email
          maxLength: 320
        source_conversation_id:
          type: string
          minLength: 1
          maxLength: 128
        pending_action:
          anyOf:
            - $ref: "#/components/schemas/GuestPendingAction"
            - type: "null"
    GuestHandoffCreateResponse:
      type: object
      required:
        - handoff_id
        - expires_at
      properties:
        handoff_id:
          type: string
        expires_at:
          type: string
          format: date-time
    GuestHandoffClaimResponse:
      type: object
      required:
        - conversation_id
        - pending_action
      properties:
        conversation_id:
          type: string
        pending_action:
          anyOf:
            - $ref: "#/components/schemas/GuestPendingAction"
            - type: "null"
    GuestIdentityLinkRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    GuestFunnelClientEventRequest:
      type: object
      additionalProperties: false
      required:
        - event
        - language
        - surface
        - terminal_outcome
      properties:
        event:
          type: string
          enum: [starter_action_selected, conversion_prompt_shown]
        language:
          type: string
          enum: [en, es-419]
        surface:
          type: string
          enum: [starter_actions, conversion_modal]
        strategy_category:
          type:
            - string
            - "null"
          enum: [buy_and_hold, dca_accumulation, null]
        conversion_reason:
          type:
            - string
            - "null"
          enum:
            - second_simulation
            - message_limit
            - save_decision
            - new_conversation
            - keep_history
            - null
        terminal_outcome:
          type: string
          enum: [selected, shown]
    ChatClarification:
      type: object
      description: Typed degraded clarification, coverage-recovery, or unsupported-recovery sidecar for chat final payloads and assistant metadata.
      required:
        - kind
        - reason_code
        - semantic_needs
        - payload
        - options
      properties:
        kind:
          type: string
          enum: [clarification, coverage_recovery, unsupported_recovery]
        reason_code:
          type: string
          examples: [missing_period, no_common_data_window, unsupported_strategy_logic]
        requested_field:
          type:
            - string
            - "null"
        requested_fields:
          type: array
          items:
            type: string
        semantic_needs:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true
          description: Typed strategy context and optional raw unsupported value.
        options:
          type: array
          items:
            $ref: "#/components/schemas/ChatClarificationOption"
    ChatClarificationOption:
      type: object
      description: Button/action option identified by typed payload, not display text.
      required:
        - id
        - replacement_values
      properties:
        id:
          type: string
          examples: [rsi_threshold, buy_and_hold, moving_average_crossover]
        replacement_values:
          type: object
          additionalProperties: true
    DateRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
    MarketDataCoverage:
      type: object
      required:
        - schema_version
        - outcome
        - requested_date_range
        - effective_date_range
        - dataset_id
      properties:
        schema_version:
          const: market_data_coverage_v1
        outcome:
          enum: [full_coverage, adjusted_coverage]
        adjustment_reason:
          type: string
          enum: [none, calendar_alignment, provider_coverage_adjustment]
          description: Code-owned explanation for requested/effective window differences. Optional for backward compatibility.
        requested_date_range:
          $ref: "#/components/schemas/DateRange"
        effective_date_range:
          $ref: "#/components/schemas/DateRange"
        dataset_id:
          type: string
          description: Stable identity of the prepared bars shared by metrics, benchmark alignment, chart construction, and finalization.
        observations_by_symbol:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    ConfirmationPeriodAdjustment:
      type: object
      required: [code, requested_date_range, effective_date_range]
      properties:
        code:
          const: effective_window_adjusted
        requested_date_range:
          $ref: "#/components/schemas/DateRange"
        effective_date_range:
          $ref: "#/components/schemas/DateRange"
    BacktestRunRequest:
      type: object
      properties:
        strategy_id:
          type: string
        conversation_id:
          type: string
        template:
          type: string
        asset_class:
          enum: [equity, crypto, currency_pair]
        symbols:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        timeframe:
          enum: [1h, 2h, 4h, 6h, 12h, 1D]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        side:
          type: string
        starting_capital:
          type: number
        allocation_method:
          const: equal_weight
        parameters:
          type: object
          additionalProperties: true
        benchmark_symbol:
          type: string
    BacktestRun:
      type: object
      required:
        - id
        - status
        - asset_class
        - symbols
        - benchmark_symbol
        - metrics
        - config_snapshot
        - conversation_result_card
      properties:
        id:
          type: string
          format: uuid
        status:
          enum: [queued, running, completed, failed]
        asset_class:
          enum: [equity, crypto]
        symbols:
          type: array
          maxItems: 5
          items:
            type: string
        allocation_method:
          const: equal_weight
        benchmark_symbol:
          type: string
          description: Equity defaults to SPY; crypto defaults to BTC.
        metrics:
          type: object
          description: Canonical aggregate and by-symbol backtest metrics.
        config_snapshot:
          type: object
          description: Reproducible normalized runtime configuration. New runs include requested_date_range, effective_date_range, and data_coverage; execution and display use the effective range while the requested range remains provenance.
        conversation_result_card:
          type: object
          description: Beginner-friendly inline chat result card. Completed chat runs may include P1 sidecar ids, decision state, and optional structured execution_costs evidence when the engine modeled fees/slippage.
    ArtifactLifecycle:
      type: string
      enum: [captured, reviewed, saved, decided, archived, discarded]
    DecisionState:
      type: string
      enum: [watching, promising, rejected, revisit_later]
    EvidenceArtifact:
      type: object
      required:
        - id
        - idea_id
        - idea_version_id
        - artifact_type
        - lifecycle
        - title
        - digest
        - payload
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        idea_id:
          type: string
          format: uuid
        idea_version_id:
          type: string
          format: uuid
        source_conversation_id:
          type:
            - string
            - "null"
          format: uuid
        source_run_id:
          type:
            - string
            - "null"
          format: uuid
        artifact_type:
          const: backtest
        lifecycle:
          $ref: "#/components/schemas/ArtifactLifecycle"
        title:
          type: string
        digest:
          type: string
        payload:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DecisionNote:
      type: object
      required:
        - id
        - idea_id
        - idea_version_id
        - evidence_artifact_id
        - decision_state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        idea_id:
          type: string
          format: uuid
        idea_version_id:
          type: string
          format: uuid
        evidence_artifact_id:
          type: string
          format: uuid
        source_conversation_id:
          type:
            - string
            - "null"
          format: uuid
        decision_state:
          $ref: "#/components/schemas/DecisionState"
        note:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DecisionNoteCreate:
      type: object
      required:
        - decision_state
      properties:
        decision_state:
          $ref: "#/components/schemas/DecisionState"
        note:
          type:
            - string
            - "null"
          maxLength: 2000
    DecisionNoteResponse:
      type: object
      required:
        - decision
        - evidence_artifact
      properties:
        decision:
          $ref: "#/components/schemas/DecisionNote"
        evidence_artifact:
          $ref: "#/components/schemas/EvidenceArtifact"
    BacktestJob:
      type: object
      required:
        - id
        - status
        - retryable
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type:
            - string
            - "null"
          format: uuid
        request_message_id:
          type:
            - string
            - "null"
          format: uuid
        confirmation_message_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          enum: [queued, running, succeeded, failed, canceled, expired]
        result_run_id:
          type:
            - string
            - "null"
          format: uuid
        failure_code:
          type:
            - string
            - "null"
        failure_detail:
          type:
            - string
            - "null"
        retryable:
          type: boolean
        queued_at:
          type:
            - string
            - "null"
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    BacktestJobResponse:
      type: object
      required:
        - job
        - run
      properties:
        job:
          $ref: "#/components/schemas/BacktestJob"
        run:
          oneOf:
            - $ref: "#/components/schemas/BacktestRun"
            - type: "null"
        result_readout:
          description: Backend-generated Quick take markdown for completed workflow jobs.
          type:
            - string
            - "null"
        result_readout_source:
          description: Provenance for the backend-generated Quick take markdown.
          type:
            - string
            - "null"
        result_readout_fallback_used:
          description: Whether the deterministic fallback renderer produced the readout.
          type:
            - boolean
            - "null"
        result_readout_failure_mode:
          description: Optional reason the normal result readout path could not complete.
          type:
            - string
            - "null"
    UsageWindow:
      type: object
      required:
        - limit
        - used
        - remaining
        - period_end
      properties:
        limit:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        period_end:
          type: string
          format: date-time
    UsageAllowance:
      type: object
      description: Backend-derived allowance truth for the account's active windows.
      required:
        - hour
        - day
        - guest_session
        - available_now
        - limiting_window
      properties:
        hour:
          anyOf:
            - $ref: "#/components/schemas/UsageWindow"
            - type: "null"
        day:
          anyOf:
            - $ref: "#/components/schemas/UsageWindow"
            - type: "null"
        guest_session:
          anyOf:
            - $ref: "#/components/schemas/UsageWindow"
            - type: "null"
        available_now:
          type: boolean
        limiting_window:
          type: string
          enum:
            - hour
            - day
            - guest_session
    UsageAllowances:
      type: object
      required:
        - messages
        - backtests
      properties:
        messages:
          $ref: "#/components/schemas/UsageAllowance"
        backtests:
          $ref: "#/components/schemas/UsageAllowance"
    UsageAllowanceResponse:
      type: object
      required:
        - allowances
      properties:
        allowances:
          $ref: "#/components/schemas/UsageAllowances"
    Collection:
      type: object
      description: Lightweight organizational grouping of strategies.
    Strategy:
      type: object
      description: Saved executable idea backed by a supported Alpha template.
    Error:
      type: object
      description: RFC 9457 Problem Details with code and request_id.
tags:
  - name: backtest_runs
    description: Immutable Alpha simulation results.
