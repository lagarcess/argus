          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AccessApprovalResponse:
      properties:
        approved:
          type: boolean
          const: true
          default: true
      additionalProperties: false
      type: object
    AccessRequestAccepted:
      properties:
        accepted:
          type: boolean
          const: true
      additionalProperties: false
      type: object
      required:
      - accepted
    AccessRequestCreate:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
        language:
          type: string
          enum:
          - en
          - es-419
      additionalProperties: false
      type: object
      required:
      - email
      - language
    AccountCapabilities:
      properties:
